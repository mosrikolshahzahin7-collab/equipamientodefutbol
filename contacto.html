<!DOCTYPE html>
<html lang="es">
<head>
  <title>Contacto - Tienda de Fútbol</title>
  <meta charset="UTF-8">
  <meta name= "author" content="Mosrikol" />
  <meta name= "description" content="Equipamiento de futbol" />
  <meta name="keywords" content="Camisetas,fútbol,dorsal"/>
  <link rel="stylesheet" href="css/equipamientodefutbol.css">
  <link rel="shortcut icon" type="image/x-icon" href="imagenes/icono.png" />
</head>
<body>
  <header>
    <h1>⚽ Tienda de Equipaciones</h1>
    <nav>
      <a href="index.html">Inicio</a> 
      <a href="productos.html">Productos</a> 
      <a href="contacto.html">Contacto</a>
      <a href="contacto.xml" style="background: gold; color: black; padding: 5px; border-radius: 5px;">Ver XML</a>
    </nav>
  </header>

 <main>
    <section id="contacto">
      <h2>Contacto</h2>
      <p>Email: equipamientodefutbol@gmail.com</p>

      <form action="#" method="post" class="form-contacto">
        <div class="campo">
          <label for="nombre">Nombre Completo:</label>
          <input type="text" id="nombre" name="nombre" required>
        </div>

        <div class="campo">
          <label for="email">Correo Electrónico:</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="campo">
          <label for="asunto">Asunto:</label>
          <select id="asunto" name="asunto">
            <option value="pedido">Estado de mi pedido</option>
            <option value="tallas">Duda sobre tallas</option>
            <option value="otros">Otros</option>
          </select>
        </div>

        <div class="campo">
          <label for="mensaje">Mensaje:</label>
          <textarea id="mensaje" name="mensaje" rows="5"></textarea>
        </div>

        <button type="submit">Enviar Mensaje</button>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Mosrikol. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
